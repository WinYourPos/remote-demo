<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F4F6F8;--surface-3:#E8EBEF;
  --border:rgba(17,24,39,.10);--border-2:rgba(17,24,39,.16);
  --text:#0B0D12;--dim:rgba(13,17,23,.58);--dim-2:rgba(13,17,23,.4);
  --primary:#1B6FF3;--primary-2:#0A5FE0;
  --grad:linear-gradient(135deg,#2F86FF,#1366EC);
  --success:#16A34A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh}
body{
  background:var(--bg);color:var(--text);
  font-family:'Sora',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.15em;stroke-width:2;stroke:currentColor;fill:none;flex-shrink:0;line-height:1}

/* ----- App shell ----- */
.app{display:flex;flex-direction:column;height:100dvh;position:relative}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 22px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  flex-shrink:0;z-index:10;
}
.back{
  display:inline-grid;place-items:center;
  width:38px;height:38px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);text-decoration:none;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.back:hover{background:var(--surface-3);border-color:var(--border-2)}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .brand-logo{width:30px;height:30px;flex-shrink:0}
.brand small{font-weight:400;color:var(--dim);font-size:13px;margin-left:4px}
.topbar .live-dot{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono';font-size:11px;color:var(--dim);
  letter-spacing:.08em;text-transform:uppercase;
}
.topbar .live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ----- Chat area ----- */
.chat{
  flex:1;overflow-y:auto;
  padding:24px 22px 12px;
  display:flex;flex-direction:column;gap:18px;
  scroll-behavior:smooth;
}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}

.msg{display:flex;gap:12px;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.msg .av{
  width:34px;height:34px;border-radius:11px;flex-shrink:0;
  display:grid;place-items:center;
}
.msg.guru .av{
  background:linear-gradient(135deg,rgba(47,134,255,.20),rgba(19,102,236,.10));
  border:1px solid rgba(27,111,243,.35);
  color:var(--primary);
}
.msg.guru .av svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg .body{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;
  font-size:14.5px;line-height:1.55;color:var(--text);
  max-width:680px;
}
.msg.guru .body{border-color:rgba(27,111,243,.18);background:linear-gradient(135deg,rgba(27,111,243,.04),rgba(19,102,236,.02))}
.msg.user{justify-content:flex-end}
.msg.user .av{
  background:var(--surface-3);border:1px solid var(--border-2);
  color:var(--dim);font-family:'JetBrains Mono';font-size:13px;font-weight:700;
  order:2;
}
.msg.user .body{
  background:var(--grad);color:#FFFFFF;border:none;
  font-weight:600;
}
.msg.thinking .body{
  display:flex;gap:5px;align-items:center;color:var(--dim);
  font-family:'JetBrains Mono';font-size:13px;
}
.msg.thinking .dot{
  width:6px;height:6px;border-radius:50%;background:var(--primary);
  animation:blink 1.2s infinite ease-in-out;
}
.msg.thinking .dot:nth-child(2){animation-delay:.2s}
.msg.thinking .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.g-block{margin-top:14px;opacity:0;transform:translateY(6px);animation:g-rise .5s cubic-bezier(.2,.8,.2,1) forwards}
.g-block:first-child{margin-top:0}
.g-block:nth-of-type(1){animation-delay:0ms}
.g-block:nth-of-type(2){animation-delay:380ms}
.g-block:nth-of-type(3){animation-delay:760ms}
.g-block:nth-of-type(4){animation-delay:1140ms}
.g-disc{opacity:0;transform:translateY(6px);animation:g-rise .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:1520ms}
@keyframes g-rise{to{opacity:1;transform:translateY(0)}}
.g-l{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--primary);text-transform:uppercase;margin-bottom:6px}
.g-lead{font-size:14.5px;line-height:1.55;color:var(--text)}
.g-lead b{color:var(--primary)}
.g-ul{padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--dim);line-height:1.55;margin:0}
.g-ul li::marker{color:var(--primary)}
.g-ul b{color:var(--text)}
.g-meta{font-size:11.5px;color:var(--dim-2);margin-top:6px;font-family:'JetBrains Mono'}
.g-disc{
  margin-top:14px;padding:10px 14px;
  background:rgba(27,111,243,.05);border:1px solid rgba(27,111,243,.18);
  border-radius:10px;font-size:12px;color:var(--dim);line-height:1.5;
}
.g-disc b{color:var(--text)}

/* ----- Starters ----- */
.starters{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:0 22px 16px;
}
.starter{
  padding:9px 15px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--dim);font-family:inherit;font-size:13px;font-weight:500;
  cursor:pointer;transition:.15s;
}
.starter:hover{border-color:rgba(27,111,243,.45);background:rgba(27,111,243,.08);color:var(--text)}
.starter:active{transform:scale(.97)}
.starters.hidden{display:none}

/* ----- Composer ----- */
.composer{
  display:flex;align-items:center;gap:8px;
  padding:14px 22px 22px;
  border-top:1px solid var(--border);
  background:rgba(255,255,255,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  flex-shrink:0;
  padding-bottom:calc(22px + env(safe-area-inset-bottom));
}
.composer-row{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border:1.5px solid var(--border-2);
  border-radius:14px;padding:6px 6px 6px 16px;
  transition:border-color .15s,box-shadow .15s;
}
.composer-row:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(27,111,243,.10)}
.composer input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:inherit;font-size:15px;padding:10px 0;
}
.composer input::placeholder{color:var(--dim-2)}
.composer .send{
  width:38px;height:38px;border-radius:10px;
  background:var(--grad);border:none;color:#FFFFFF;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(27,111,243,.30);
  transition:transform .12s;flex-shrink:0;
}
.composer .send:hover{transform:translateY(-1px)}
.composer .send:active{transform:scale(.94)}
.composer .send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.composer .send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:560px){
  .topbar{padding:12px 14px}
  .brand small{display:none}
  .chat{padding:18px 14px 8px}
  .starters{padding:0 14px 14px}
  .composer{padding:12px 14px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .msg .body{font-size:14px;padding:12px 14px}
}

/* >>> PAGE-TRANSITION-CSS >>> */
@keyframes spark-page-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes spark-page-out{to{opacity:0;transform:translateY(-4px)}}
body{animation:spark-page-in .42s cubic-bezier(.2,.8,.2,1)}
body.spark-leaving{animation:spark-page-out .22s cubic-bezier(.55,.05,.7,.18) forwards}
@media (prefers-reduced-motion: reduce){
  body,body.spark-leaving{animation:none}
}
/* <<< PAGE-TRANSITION-CSS <<< */

<script>
const GURU = {
  campaign: {
    q: "What campaign should I run this week?",
    body: `
      <div class="g-block"><div class="g-l">Read of your data</div><ul class="g-ul">
        <li>Pasta category margin sits at <b>64%</b> — your highest after Dessert</li>
        <li>Wine attach on pasta orders is <b>78%</b> vs 62% on burger nights</li>
        <li>Tuesday / Wednesday dinner is your softest daypart (avg 18 covers vs Friday 42)</li>
      </ul></div>
      <div class="g-block"><div class="g-l">Recommendation</div><p class="g-lead">Run a <b>"Pasta + Wine $24" prix-fixe</b> — Tuesday–Thursday 5–7pm.</p></div>
      <div class="g-block"><div class="g-l">Why it'll work</div><ul class="g-ul">
        <li>Hits a soft daypart with your highest-margin pairing</li>
        <li>Wine-pairing positioning lifts the average check</li>
        <li>Inventory: 4 weeks of full-volume runs covered</li>
      </ul></div>
      <div class="g-block"><div class="g-l">Expected outcome</div>
        <p class="g-lead">+18–22% pasta units · +$4–6 average check on those nights</p>
        <p class="g-meta">Channel: SMS to loyalty + in-app banner · breakeven by week 2</p>
      </div>
      <div class="g-disc"><b>Starting point only.</b> Guru reads what's in your data — for pricing or supplier calls, consult an industry specialist before acting.</div>`
  },
  dish: {
    q: "What new dish should I add to the menu?",
    body: `
      <div class="g-block"><div class="g-l">Read of your data</div><ul class="g-ul">
        <li>"Avocado +$2" sells <b>19 units/day</b> at near-100% margin</li>
        <li>"Truffle fries +$3" sells <b>27 units/day</b> — premium add-ons resonate</li>
        <li>Brunch has 5 items vs 12 dinner items, despite <b>32%</b> of under-30 guests ordering it</li>
      </ul></div>
      <div class="g-block"><div class="g-l">Recommendation</div><p class="g-lead">Add <b>"Smoked Salmon &amp; Avocado Toast" at $17</b> to the brunch menu.</p></div>
      <div class="g-block"><div class="g-l">Why it'll work</div><ul class="g-ul">
        <li>Combines two of your best-selling premium ingredients</li>
        <li>Targets the under-30 brunch cohort that's still growing</li>
        <li>Brunch margin is <b>71%</b> vs dinner average 56%</li>
      </ul></div>
      <div class="g-block"><div class="g-l">Expected outcome</div>
        <p class="g-lead">8–12 units / weekend day in the first month</p>
        <p class="g-meta">Validate with a 2-week trial menu insert + A/B social test before a permanent slot</p>
      </div>
      <div class="g-disc"><b>Starting point only.</b> Validate with your chef and run a 14-day pilot before committing.</div>`
  },
  opportunity: {
    q: "What's my biggest opportunity right now?",
    body: `
      <div class="g-block"><div class="g-l">Read of your data</div><ul class="g-ul">
        <li>Sauté station average ticket time: <b>11.1 min</b> — 1.1 min over target</li>
        <li>That bottleneck costs you ~3 turns per dinner service on busy nights</li>
        <li>Pasta carries 64% margin but is only <b>7%</b> of revenue (vs 18% potential)</li>
      </ul></div>
      <div class="g-block"><div class="g-l">Recommendation</div><p class="g-lead">Speed up Sauté <b>and</b> reposition Pasta as a featured category.</p></div>
      <div class="g-block"><div class="g-l">30-day plan</div><ul class="g-ul">
        <li>Move 2 pasta items into the "Most ordered" carousel</li>
        <li>Train Sauté on a parallel prep flow for the carbonara / scampi pair</li>
        <li>Add a $12 lunch pasta special Mon–Wed</li>
      </ul></div>
      <div class="g-block"><div class="g-l">Expected outcome</div><p class="g-lead">+$3,200 / week revenue · Sauté ticket time → 9.5 min</p></div>
      <div class="g-disc"><b>Starting point only.</b> Staffing implications need your kitchen manager's read before the change rolls out.</div>`
  },
  margin: {
    q: "How's my margin trending?",
    body: `
      <div class="g-block"><div class="g-l">Read of your data</div><ul class="g-ul">
        <li>Net margin slipped from <b>25% → 23%</b> this month</li>
        <li>COGS up <b>1.8 pts</b> — supplier price increase on ribeye + truffle</li>
        <li>Labor flat (28.3%, within target). Service mix unchanged.</li>
      </ul></div>
      <div class="g-block"><div class="g-l">Recommendation</div><p class="g-lead">Two moves to recover ~1.5 pts within four weeks.</p></div>
      <div class="g-block"><div class="g-l">Moves</div><ol class="g-ul">
        <li><b>Renegotiate ribeye.</b> You order 18/day at $12.50. Vendor X benchmark: $10.85 — annual save ~$10,800.</li>
        <li><b>Swap the "truffle fries" garnish</b> from truffle oil to shaved parmesan. Cost: −$0.40 / serve. Guest feedback delta: −1%.</li>
      </ol></div>
      <div class="g-block"><div class="g-l">Expected outcome</div><p class="g-lead">+1.5 pts net margin within 4 weeks of move 1</p></div>
      <div class="g-disc"><b>Starting point only.</b> Switching suppliers needs a formal RFQ + trial shipments before commitment.</div>`
  },
  // Fallback for anything we can't route
  default: {
    q: null,
    body: `
      <p class="g-lead">I haven't trained on that exact question yet, but here's where I'd start looking in your data.</p>
      <div class="g-block" style="margin-top:14px"><div class="g-l">Try one of these instead</div><ul class="g-ul">
        <li>"What campaign should I run this week?"</li>
        <li>"What new dish should I add?"</li>
        <li>"What's my biggest opportunity right now?"</li>
        <li>"How's my margin trending?"</li>
      </ul></div>
      <div class="g-disc"><b>Starting point only.</b> For anything that affects pricing, supplier or staffing, talk to a restaurant industry specialist.</div>`
  }
};

const chat = document.getElementById('chat');
const starters = document.getElementById('starters');
const input = document.getElementById('composerInput');
const send = document.getElementById('composerSend');

const GURU_AV = '<svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>';

function scrollToBottom(){ requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); }

function addUser(text){
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="body"></div><div class="av">You</div>';
  div.querySelector('.body').textContent = text;
  chat.appendChild(div);
  scrollToBottom();
}

function addThinking(){
  const div = document.createElement('div');
  div.className = 'msg guru thinking';
  div.innerHTML = '<div class="av">' + GURU_AV + '</div><div class="body"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  chat.appendChild(div);
  scrollToBottom();
  return div;
}

function addGuru(html){
  const div = document.createElement('div');
  div.className = 'msg guru';
  div.innerHTML = '<div class="av">' + GURU_AV + '</div><div class="body">' + html + '</div>';
  chat.appendChild(div);
  scrollToBottom();
}

function pickKey(txt){
  const t = (txt || '').toLowerCase();
  if (/camp|promo|run|event|special/.test(t)) return 'campaign';
  if (/dish|menu|add|item|food|plate/.test(t)) return 'dish';
  if (/margin|cogs|cost|profit|p&l|expense/.test(t)) return 'margin';
  if (/opp|grow|focus|priorit|next/.test(t)) return 'opportunity';
  return null;
}

function ask(question){
  if (!question || !question.trim()) return;
  addUser(question);
  const thinking = addThinking();
  setTimeout(() => {
    thinking.remove();
    const key = pickKey(question);
    const data = key ? GURU[key] : GURU.default;
    addGuru(data.body);
  }, 1900);
}

starters.querySelectorAll('.starter').forEach(b => {
  b.addEventListener('click', () => {
    const key = b.dataset.q;
    ask(GURU[key].q);
  });
});

send.addEventListener('click', () => {
  const v = input.value.trim();
  if (!v) return;
  input.value = '';
  ask(v);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send.click();
  }
});

// Focus the input on desktop (avoid pulling the mobile keyboard up automatically)
if (matchMedia('(hover: hover)').matches) input.focus();

/* >>> PAGE-NAV-FADE-JS >>> */
(function(){
  if (typeof document === 'undefined') return;
  if (typeof document.addEventListener !== 'function') return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded',fn); }
  ready(function(){
    document.addEventListener('click', function(e){
      var a = e.target && e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (!href || href.charAt(0) === '#' || href.indexOf('mailto:')===0 || href.indexOf('tel:')===0) return;
      if (a.target && a.target !== '_self') return;          // _blank etc. — let it open in new tab
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var dest;
      try { dest = new URL(a.href, location.href); } catch (err) { return; }
      if (dest.origin !== location.origin) return;
      if (dest.pathname === location.pathname && dest.hash) return; // same-page anchor
      e.preventDefault();
      document.body.classList.add('spark-leaving');
      setTimeout(function(){ location.href = a.href; }, 200);
    });
  });
})();
